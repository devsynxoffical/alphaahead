name: Deploy to iHosting (FTP)

# Builds the React app and uploads the build/ folder to the hosting via FTPS
# every time code is pushed to main. Can also be started by hand from the
# Actions tab ("Run workflow").

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Don't fail the build on ESLint warnings
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Install Chromium for prerendering
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Prerender pages + generate sitemap.xml
        run: node scripts/prerender.js

      - name: Upload build/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.alphaaheadllc.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./build/
          # Folder on the server that is the website root. Must end with "/".
          # Set the repo variable FTP_SERVER_DIR if the FTP account does not
          # open directly in the website root (e.g. "public_html/").
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}

      - name: Verify live site serves this build
        run: |
          JS=$(grep -o 'static/js/main\.[a-z0-9]*\.js' build/index.html | head -1)
          echo "Expected bundle: $JS"
          # Server cache can take a moment to refresh - retry for up to ~3 minutes
          for i in $(seq 1 12); do
            LIVE=$(curl -sL --max-time 30 -H 'Cache-Control: no-cache' "https://alphaaheadllc.com/?v=$GITHUB_RUN_ID-$i")
            if echo "$LIVE" | grep -q "$JS"; then
              echo "Live site is serving the new build."
              echo "$LIVE" | grep -q 'google-site-verification' && echo "Google verification tag: FOUND"
              break
            fi
            if [ "$i" = 12 ]; then echo "::error::Live site is NOT serving the new build"; exit 1; fi
            echo "Attempt $i: live site not updated yet, waiting 15s..."
            sleep 15
          done

      - name: Check SEO routes on the live site
        run: |
          FAIL=0
          check() { # url expected_status
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1")
            if [ "$code" = "$2" ]; then echo "OK   $code $1"; else echo "FAIL $code (want $2) $1"; FAIL=1; fi
          }
          for p in / /services /seo /cold-calling /transaction-coordinator /blog /blog/transaction-coordinator-cost /case-studies /case-studies/zingo-assist /virtual-assistant-dubai /sitemap.xml /robots.txt /llms.txt; do
            check "https://alphaaheadllc.com$p" 200
          done
          check "https://alphaaheadllc.com/this-page-does-not-exist-$GITHUB_RUN_ID" 404
          check "https://alphaaheadllc.com/home" 301
          check "https://www.alphaaheadllc.com/" 301
          # Each prerendered page must carry its own title
          curl -s https://alphaaheadllc.com/seo | grep -o '<title[^>]*>[^<]*' | head -1
          # Every image used on key pages must load on the live server
          python3 scripts/check-live-images.py build/index.html build/clients.html build/case-studies.html build/projects.html || FAIL=1
          exit $FAIL

      - name: Notify search engines (IndexNow - Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        run: |
          URLS=$(grep -o '<loc>[^<]*' build/sitemap.xml | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"alphaaheadllc.com\",\"key\":\"44e1b280c3ca4c25afd946d34e57e2a4\",\"keyLocation\":\"https://alphaaheadllc.com/44e1b280c3ca4c25afd946d34e57e2a4.txt\",\"urlList\":$URLS}"
