name: Deploy to iHosting (FTP)

# Builds the React app and uploads the build/ folder to the hosting via FTPS
# every time code is pushed to main. Can also be started by hand from the
# Actions tab ("Run workflow").

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Don't fail the build on ESLint warnings
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Check FTP server is reachable
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          for h in "$FTP_SERVER" ftp.alphaaheadllc.com alphaaheadllc.com ftp.alphaahead.com; do
            ip=$(getent hosts "$h" | awk '{print $1}' | head -1)
            if [ -z "$ip" ]; then echo "$h: DNS name not found"; continue; fi
            if timeout 10 bash -c "</dev/tcp/$h/21" 2>/dev/null; then
              echo "$h ($ip): port 21 OPEN"
            else
              echo "$h ($ip): port 21 closed / timed out"
            fi
          done

      - name: Upload build/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./build/
          # Folder on the server that is the website root. Must end with "/".
          # Set the repo variable FTP_SERVER_DIR if the FTP account does not
          # open directly in the website root (e.g. "public_html/").
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
