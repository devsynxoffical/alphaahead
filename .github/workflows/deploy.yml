name: Deploy to iHosting (FTP)

# Builds the React app and uploads the build/ folder to the hosting via FTPS
# every time code is pushed to main. Can also be started by hand from the
# Actions tab ("Run workflow").

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Don't fail the build on ESLint warnings
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Upload build/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.alphaaheadllc.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./build/
          # Folder on the server that is the website root. Must end with "/".
          # Set the repo variable FTP_SERVER_DIR if the FTP account does not
          # open directly in the website root (e.g. "public_html/").
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}

      - name: Verify live site serves this build
        run: |
          sleep 10
          JS=$(grep -o 'static/js/main\.[a-z0-9]*\.js' build/index.html | head -1)
          echo "Expected bundle: $JS"
          LIVE=$(curl -sL --max-time 30 "https://alphaaheadllc.com/?nocache=$GITHUB_RUN_ID")
          echo "$LIVE" | grep -o 'static/js/main\.[a-z0-9]*\.js' | head -1 | sed 's/^/Live bundle:     /'
          echo "$LIVE" | grep -q 'google-site-verification' && echo "Google verification tag: FOUND" || echo "Google verification tag: MISSING"
          for p in / /services /seo /contact /sitemap-check-404; do
            echo "$p -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://alphaaheadllc.com$p")"
          done
          echo "$LIVE" | grep -q "$JS" || { echo "::error::Live site is NOT serving the new build - check FTP_SERVER_DIR (website root folder)"; exit 1; }
          echo "Live site is serving the new build."
